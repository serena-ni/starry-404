<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 - lost in space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      background: linear-gradient(135deg, #0a0f20 0%, #1a0a2e 50%, #0f1624 100%);
      overflow: hidden;
      color: #c4c9e0;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(1px 1px at 70% 80%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(1.2px 1.2px at 40% 60%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(1.5px 1.5px at 90% 20%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1px 1px at 10% 90%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1.3px 1.3px at 50% 50%, rgba(100, 150, 255, 0.5), transparent),
        radial-gradient(1px 1px at 80% 50%, rgba(150, 180, 255, 0.4), transparent),
        radial-gradient(1.2px 1.2px at 25% 75%, rgba(200, 180, 255, 0.45), transparent);
      animation: drift 80s linear infinite;
      opacity: 0.7;
    }

    @keyframes drift {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-200px);
      }
    }

    /* Center content */
    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(5rem, 15vw, 9rem);
      letter-spacing: 0.12em;
      margin-bottom: 1.5rem;
      opacity: 0.85;
      font-weight: 300;
      color: #d4dae8;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
      opacity: 0.7;
      letter-spacing: 0.05em;
      transition: opacity 0.6s cubic-bezier(0.23, 1, 0.320, 1);
    }

    p {
      font-size: 1rem;
      max-width: 420px;
      line-height: 1.8;
      opacity: 0.6;
      transition: opacity 0.6s cubic-bezier(0.23, 1, 0.320, 1);
    }

    /* Floating hint */
    .hint {
      position: absolute;
      bottom: 3rem;
      font-size: 0.8rem;
      opacity: 0.35;
      letter-spacing: 0.08em;
    }

    /* Subtle hover interaction */
    body:hover h1 {
      text-shadow: 0 0 12px rgba(140, 160, 220, 0.25),
                   0 0 24px rgba(100, 130, 200, 0.12);
      transform: translateY(-2px);
    }

    body:hover h2 {
      opacity: 0.85;
    }

    body:hover p {
      opacity: 0.75;
    }

    /* Subtle pulse effect on 404 */
    @keyframes subtlePulse {
      0%, 100% {
        text-shadow: 0 0 8px rgba(120, 140, 200, 0.15);
      }
      50% {
        text-shadow: 0 0 12px rgba(120, 140, 200, 0.2);
      }
    }

    h1 {
      animation: subtlePulse 4s ease-in-out infinite;
    }

    /* Nebula clouds */
    .nebula {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .nebula-layer {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 40%, rgba(120, 100, 220, 0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, rgba(100, 140, 240, 0.12) 0%, transparent 50%);
      animation: nebulaDrift 120s linear infinite;
      opacity: 1;
    }

    .nebula-layer:nth-child(2) {
      animation: nebulaDrift 140s linear infinite reverse;
      opacity: 0.8;
      animation-delay: 10s;
    }

    @keyframes nebulaDrift {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(-50px, -50px) scale(1.05);
      }
    }

    /* floating particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(200, 200, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }

    .particle:nth-child(1) {
      left: 15%;
      top: 20%;
      animation: float 20s ease-in-out infinite;
    }

    .particle:nth-child(2) {
      left: 25%;
      top: 40%;
      animation: float 18s ease-in-out infinite;
      animation-delay: -5s;
    }

    .particle:nth-child(3) {
      left: 60%;
      top: 25%;
      animation: float 22s ease-in-out infinite;
      animation-delay: -10s;
    }

    .particle:nth-child(4) {
      left: 75%;
      top: 55%;
      animation: float 19s ease-in-out infinite;
      animation-delay: -8s;
    }

    .particle:nth-child(5) {
      left: 40%;
      top: 70%;
      animation: float 21s ease-in-out infinite;
      animation-delay: -3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0.4;
      }
      50% {
        transform: translateY(-30px) translateX(20px);
        opacity: 0.7;
      }
    }

    /* shooting stars */
    @keyframes shootingStar {
      from {
        left: -10%;
        top: 20%;
        opacity: 0;
      }
      5% {
        opacity: 1;
      }
      95% {
        opacity: 1;
      }
      to {
        left: 110%;
        top: 60%;
        opacity: 0;
      }
    }

    .shooting-star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px rgba(180, 200, 255, 1);
      z-index: 1;
      pointer-events: none;
    }

    .shooting-star::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 180px;
      height: 3px;
      background: linear-gradient(90deg, rgba(180, 200, 255, 1), transparent);
      border-radius: 50%;
    }

    .shooting-star:nth-child(7) {
      animation: shootingStar 6s ease-in infinite;
      animation-delay: 0s;
    }

    .shooting-star:nth-child(8) {
      animation: shootingStar 7s ease-in infinite;
      animation-delay: 4s;
    }

    .shooting-star:nth-child(9) {
      animation: shootingStar 6.5s ease-in infinite;
      animation-delay: 8s;
    }

    /* parallax container for hover effect */
    .parallax-group {
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.320, 1);
    }

    body:hover .parallax-group {
      transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <div class="nebula">
    <div class="nebula-layer"></div>
    <div class="nebula-layer"></div>
  </div>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <main class="container parallax-group">
    <h1>404</h1>
    <h2>page not found</h2>
    <p>
      you drifted a little too far into the void
    </p>

    <div class="hint">✦ nothing else exists here ✦</div>
  </main>

  <script>
    document.addEventListener('mousemove', (e) => {
      const parallaxGroup = document.querySelector('.parallax-group');
      const x = (window.innerWidth / 2 - e.clientX) / window.innerWidth;
      const y = (window.innerHeight / 2 - e.clientY) / window.innerHeight;
      
      parallaxGroup.style.transform = `perspective(1000px) rotateY(${x * 3}deg) rotateX(${-y * 3}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      const parallaxGroup = document.querySelector('.parallax-group');
      parallaxGroup.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
    });
  </script>
</body>
</html>
